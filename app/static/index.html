<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Transcribe</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <nav class="side" data-i18n-aria="nav.aria">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg></span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <span class="muted small"><span class="dot" id="model-dot"></span><span id="model-status"></span></span>
      </span>
    </div>
    <div class="nav-links">
      <a href="#ceviri" data-view="ceviri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg><span data-i18n="nav.transcribe"></span></a>
      <a href="#duzenle" data-view="duzenle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span data-i18n="nav.edit"></span></a>
      <a href="#ayarlar" data-view="ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i18n="nav.settings"></span></a>
    </div>
  </nav>

  <main>
    <!-- ÇEVİRİ -->
    <section class="view" id="view-ceviri" aria-labelledby="h-ceviri">
      <header class="page-head">
        <h1 id="h-ceviri" data-i18n="tr.title"></h1>
        <p class="muted" data-i18n="tr.subtitle"></p>
      </header>

      <div class="drop" id="drop">
        <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.m4a,.mp4,.mov,.mkv,.ogg,.flac,.webm" hidden>
        <div class="drop-file">
          <span class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></span>
          <span class="file-meta">
            <strong id="file-name" data-i18n="tr.noFile"></strong>
            <span class="muted small" id="file-info" data-i18n="tr.dropHint"></span>
          </span>
        </div>
        <div class="drop-actions">
          <button type="button" class="btn" id="pick-btn" data-i18n="tr.choose"></button>
          <button type="button" class="btn primary" id="run-btn" data-i18n="tr.run" disabled></button>
        </div>
      </div>

      <div class="chips">
        <label class="chip"><span class="muted" data-i18n="tr.language"></span>
          <select id="lang-select" class="lang-options"></select>
        </label>
        <button type="button" class="chip switch-chip" role="switch" aria-checked="true" id="clean-chip">
          <span class="switch small-switch"><span></span></span><span data-i18n="tr.clean"></span>
        </button>
        <span class="chip"><span class="muted" data-i18n="tr.model"></span><strong id="model-chip"></strong></span>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="progress-row">
          <strong id="progress-label"></strong>
          <span class="muted" id="progress-meta"></span>
        </div>
        <div class="progress-bar-row">
          <div class="bar" role="progressbar" data-i18n-aria="tr.progressAria" aria-valuemin="0" aria-valuemax="100" id="bar"><span id="bar-fill"></span></div>
          <button type="button" class="btn danger" id="stop-btn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span data-i18n="tr.stop"></span></button>
        </div>
      </div>

      <section class="card" data-i18n-aria="tr.transcript">
        <div class="card-head">
          <h2 data-i18n="tr.transcript"></h2>
          <button type="button" class="btn ghost-danger" id="clear-raw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span data-i18n="btn.clear"></span></button>
          <button type="button" class="btn" id="copy-raw"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><span data-i18n="btn.copy"></span></button>
          <button type="button" class="btn" id="export-raw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span data-i18n="btn.export"></span></button>
          <button type="button" class="btn primary" id="to-edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span data-i18n="tr.toEdit"></span></button>
        </div>
        <div class="transcript" id="transcript" aria-live="polite"></div>
      </section>
    </section>

    <!-- AI DÜZENLE -->
    <section class="view" id="view-duzenle" aria-labelledby="h-duzenle" hidden>
      <header class="page-head">
        <h1 id="h-duzenle" data-i18n="ed.title"></h1>
        <p class="muted" data-i18n="ed.subtitle"></p>
      </header>
      <div class="two-col">
        <section class="card pad stack">
          <label class="stack-sm">
            <span class="row-between"><strong data-i18n="ed.source"></strong><span class="muted small" id="src-note"></span></span>
            <textarea id="src-text" rows="6" dir="auto" data-i18n-ph="ed.sourcePlaceholder"></textarea>
          </label>
          <div class="stack-sm">
            <label for="prompt-text"><strong data-i18n="ed.prompt"></strong></label>
            <div class="presets" id="presets" data-i18n-aria="ed.presetsAria"></div>
            <textarea id="prompt-text" rows="4" dir="auto"></textarea>
          </div>
          <div class="row-wrap">
            <div class="grow stack-sm">
              <span class="label" data-i18n="ed.provider"></span>
              <div class="seg" id="provider-seg"></div>
            </div>
            <label class="grow stack-sm">
              <span class="label" data-i18n="ed.model"></span>
              <select id="model-select"></select>
            </label>
          </div>
          <p class="small warn-text" id="provider-hint" hidden></p>
          <div class="row">
            <button type="button" class="btn primary grow" id="edit-run"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span data-i18n="ed.run"></span></button>
            <button type="button" class="btn danger" id="edit-stop" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span data-i18n="ed.stop"></span></button>
          </div>
        </section>

        <section class="card wide" data-i18n-aria="ed.output">
          <div class="card-head">
            <div class="grow">
              <h2 data-i18n="ed.output"></h2>
              <span class="muted small" id="edit-status"></span>
            </div>
            <button type="button" class="btn ghost-danger" id="clear-edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span data-i18n="btn.clear"></span></button>
            <button type="button" class="btn" id="copy-edit"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><span data-i18n="btn.copy"></span></button>
            <button type="button" class="btn primary" id="export-edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span data-i18n="btn.export"></span></button>
          </div>
          <article class="doc" id="edit-out" dir="auto" aria-live="polite"></article>
        </section>
      </div>
    </section>

    <!-- AYARLAR -->
    <section class="view narrow" id="view-ayarlar" aria-labelledby="h-ayarlar" hidden>
      <header class="page-head">
        <h1 id="h-ayarlar" data-i18n="st.title"></h1>
        <p class="muted" data-i18n="st.subtitle"></p>
      </header>

      <section class="card pad row-wrap" aria-labelledby="s-uilang">
        <h2 id="s-uilang" class="grow" data-i18n="st.uiLang"></h2>
        <select id="ui-lang" data-i18n-aria="st.uiLang"></select>
      </section>

      <section class="card pad stack" aria-labelledby="s-model">
        <div>
          <h2 id="s-model" data-i18n="st.model"></h2>
          <p class="muted small" id="sys-info"></p>
        </div>
        <div class="model-grid" id="model-grid"></div>
      </section>

      <section class="card pad-x" aria-labelledby="s-ses">
        <h2 id="s-ses" class="sec-title" data-i18n="st.audio"></h2>
        <div class="setting">
          <div><strong id="l-clean" data-i18n="st.clean"></strong><p class="muted small" data-i18n="st.cleanDesc"></p></div>
          <button type="button" class="switch" role="switch" aria-labelledby="l-clean" data-setting="clean"><span></span></button>
        </div>
        <div class="setting">
          <div><strong id="l-vad" data-i18n="st.vad"></strong><p class="muted small" data-i18n="st.vadDesc"></p></div>
          <button type="button" class="switch" role="switch" aria-labelledby="l-vad" data-setting="vad"><span></span></button>
        </div>
        <div class="setting">
          <div><strong id="l-norm" data-i18n="st.norm"></strong><p class="muted small" data-i18n="st.normDesc"></p></div>
          <button type="button" class="switch" role="switch" aria-labelledby="l-norm" data-setting="norm"><span></span></button>
        </div>
        <label class="setting">
          <div><strong data-i18n="st.language"></strong><p class="muted small" data-i18n="st.languageDesc"></p></div>
          <select id="lang-setting" class="lang-options"></select>
        </label>
      </section>

      <section class="card pad-x" aria-labelledby="s-ai">
        <div class="sec-title">
          <h2 id="s-ai" data-i18n="st.ai"></h2>
          <p class="muted small" data-i18n="st.aiDesc"></p>
        </div>
        <div id="key-rows"></div>
      </section>

      <section class="card pad row-wrap" aria-labelledby="s-tema">
        <h2 id="s-tema" class="grow" data-i18n="st.theme"></h2>
        <div class="seg theme-seg" id="theme-seg"></div>
      </section>
    </section>
  </main>
</div>

<!-- DIŞA AKTAR -->
<dialog id="export-dialog" aria-labelledby="ex-title">
  <form method="dialog" class="ex">
    <header class="ex-head">
      <div class="grow">
        <h2 id="ex-title" data-i18n="ex.title"></h2>
        <span class="muted small" data-i18n="ex.subtitle"></span>
      </div>
      <button class="btn icon ghost" value="close" data-i18n-aria="btn.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="ex-body">
      <div class="stack">
        <div class="stack-sm">
          <span class="label" data-i18n="ex.which"></span>
          <div class="seg" id="ex-source"></div>
        </div>
        <div class="stack-sm">
          <span class="label" data-i18n="ex.format"></span>
          <div class="formats" id="ex-formats"></div>
          <span class="muted small" id="ex-format-desc"></span>
        </div>
        <div class="stack" id="ex-typo">
          <label class="stack-sm"><span class="label" data-i18n="ex.font"></span><select id="ex-font"></select></label>
          <div class="row-wrap">
            <div class="grow stack-sm"><span class="label" data-i18n="ex.size"></span><div class="seg" id="ex-size"></div></div>
            <div class="grow stack-sm"><span class="label" data-i18n="ex.spacing"></span><div class="seg" id="ex-spacing"></div></div>
          </div>
        </div>
        <div>
          <label class="check"><input type="checkbox" id="ex-title-on" checked> <span data-i18n="ex.addTitle"></span></label>
          <label class="check" id="ex-ts-row"><input type="checkbox" id="ex-ts"> <span data-i18n="ex.addTimestamps"></span></label>
        </div>
      </div>
      <div class="stack-sm">
        <span class="label"><span data-i18n="ex.preview"></span> · <span id="ex-format-name">PDF</span></span>
        <div class="paper-wrap"><div class="paper" id="ex-preview"></div></div>
        <span class="ok-text small" data-i18n="ex.embedded"></span>
      </div>
    </div>
    <footer class="ex-foot">
      <label class="grow stack-sm">
        <span class="label" data-i18n="ex.filename"></span>
        <span class="filename"><input type="text" id="ex-name" dir="auto"><span id="ex-ext">.pdf</span></span>
      </label>
      <div class="row">
        <button class="btn" value="cancel" data-i18n="btn.cancel"></button>
        <button type="button" class="btn primary" id="ex-save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span id="ex-save-label"></span></button>
      </div>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
